<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Mahasiswa</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 30px;
    }

    .form-section {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .form-section h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
    }

    input {
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      flex: 1;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    th, td {
      padding: 14px;
      text-align: left;
    }

    tbody tr:hover {
      background: #f3f4f6;
    }

    .action-buttons {
      display: flex;
      gap: 6px;
    }

    .btn-edit {
      background: #10b981;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
    }

    .btn-delete {
      background: #ef4444;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Sistem Manajemen Data Mahasiswa</h1>
    <p>CRUD Node.js + MySQL</p>
  </div>

  <div class="content">

    <!-- FORM -->
    <div class="form-section">
      <h2 id="formTitle">Tambah Mahasiswa</h2>

      <div class="form-group">
        <div class="input-wrapper">
          <label>Nama</label>
          <input type="text" id="nama">
        </div>
        <div class="input-wrapper">
          <label>NIM</label>
          <input type="text" id="nim">
        </div>
        <div class="input-wrapper">
          <label>Jurusan</label>
          <input type="text" id="jurusan">
        </div>
        <div class="input-wrapper">
          <label>Email</label>
          <input type="email" id="email">
        </div>
      </div>

      <div class="button-group">
        <button class="btn-primary" onclick="simpanMahasiswa()">
          <span id="btnText">Tambah</span>
        </button>
        <button class="btn-secondary" id="btnBatal" onclick="batalEdit()" style="display:none">
          Batal
        </button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-section">
      <h2>Daftar Mahasiswa</h2>
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>NIM</th>
            <th>Jurusan</th>
            <th>Email</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="listMahasiswa">
          <tr>
            <td colspan="6">Memuat data...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
