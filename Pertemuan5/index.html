<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pembelian Barang</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    h2 {
      margin-bottom: 15px;
    }
    ul {
      list-style-type: disc;
      margin-left: 20px;
    }
    button {
      margin-top: 15px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    p {
      margin-top: 15px;
      font-size: 16px;
    }
    b {
      font-size: 17px;
    }
  </style>
</head>
<body>
  <h2>Pembelian Barang</h2>
  <ul>
    <li>Susu UHT — Rp 42.000 × 10</li>
    <li>Roti Tawar — Rp 30.000 × 3</li>
    <li>Mie Instan — Rp 20.000 × 5</li>
    <li>Sosis — Rp 51.000 × 7</li>
  </ul>

  <button onclick="hitungTotal()">Hitung Total Harga</button>

  <p id="hasil"></p>

  <script>
    function hitungTotal() {
      const barang = [
        { harga: 42000, jumlah: 10 },
        { harga: 30000, jumlah: 3 },
        { harga: 20000, jumlah: 5 },
        { harga: 51000, jumlah: 7 }
      ];

      let total = 0;
      for (let i = 0; i < barang.length; i++) {
        total += barang[i].harga * barang[i].jumlah;
      }

      document.getElementById("hasil").innerHTML =
        "Total harga pembelian adalah: <b>Rp " + total.toLocaleString('id-ID') + "</b>";
    }
  </script>
</body>
</html>
